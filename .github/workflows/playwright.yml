name: Playwright Tests

on:
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create test accounts file
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          mkdir -p resources
          jq -n \
            --arg username "$TEST_USERNAME" \
            --arg password "$TEST_PASSWORD" \
            '[{
              id: "customer01",
              userName: $username,
              password: $password,
              role: "customer"
            }]' > resources/accounts.json

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=chromium --reporter=line,allure-playwright

      - name: Generate Allure report
        if: always()
        run: npx allure generate ./reports/allure-results -o .allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/